version: "3.9"

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  SECRET_KEY:             ${SECRET_KEY}
  ALLOWED_HOSTS:          ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  CSRF_TRUSTED_ORIGINS:   ${CSRF_TRUSTED_ORIGINS:-http://localhost}
  DB_NAME:                ${DB_NAME:-plataforma_osint}
  DB_USER:                ${DB_USER:-osintng}
  DB_PASSWORD:            ${DB_PASSWORD}
  DB_HOST:                db
  DB_PORT:                "5432"
  REDIS_URL:              redis://redis:6379/0
  CELERY_BROKER_URL:      redis://redis:6379/0
  CELERY_RESULT_BACKEND:  redis://redis:6379/1
  ANTHROPIC_API_KEY:      ${ANTHROPIC_API_KEY:-}
  HIBP_API_KEY:           ${HIBP_API_KEY:-}
  TRUSTED_PROXIES:        nginx

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB:       ${DB_NAME:-plataforma_osint}
      POSTGRES_USER:     ${DB_USER:-osintng}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-osintng}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Django / Gunicorn ───────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --config gunicorn.conf.py"
    volumes:
      - static_volume:/app/staticfiles
      - logs_volume:/app/logs
    environment:
      <<: *django-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery worker ───────────────────────────────────────────────────────────
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config.celery worker --loglevel=info --concurrency=4
    volumes:
      - logs_volume:/app/logs
    environment:
      <<: *django-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Beat ─────────────────────────────────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A config.celery beat --loglevel=info
    volumes:
      - logs_volume:/app/logs
    environment:
      <<: *django-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Nginx (reverse proxy + TLS) ─────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - static_volume:/app/staticfiles:ro
      - logs_volume:/var/log/nginx
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  static_volume:
  logs_volume:
