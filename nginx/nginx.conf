user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ────────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 4096;
    server_tokens      off;

    # ── Gzip ───────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/xml+rss image/svg+xml;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=global:20m  rate=30r/m;
    limit_req_zone  $binary_remote_addr zone=api:20m     rate=60r/m;
    limit_req_zone  $binary_remote_addr zone=auth:10m    rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Upstream (Gunicorn) ───────────────────────────────────────────────────
    upstream django {
        server web:8000 fail_timeout=0;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS server ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        # TLS (replace with real certs or use certbot)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_session_cache   shared:SSL:20m;
        ssl_session_timeout 1d;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        # ── Security headers ──────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header X-Frame-Options           "DENY"                                         always;
        add_header X-XSS-Protection          "1; mode=block"                                always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"     always;

        # ── Request size ──────────────────────────────────────────────────────
        client_max_body_size 10m;
        client_body_timeout  30s;
        client_header_timeout 15s;

        # ── Rate limiting ─────────────────────────────────────────────────────
        limit_req  zone=global burst=20 nodelay;
        limit_conn conn_limit 20;

        # ── Static files (WhiteNoise handles, but Nginx is faster) ─────────────
        location /static/ {
            alias /app/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            gzip_static on;
        }

        # ── Auth endpoints — strict rate limiting ─────────────────────────────
        location ~ ^/auth/(login|signup|password) {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://django;
            include    /etc/nginx/snippets/proxy_params.conf;
        }

        # ── API endpoints ─────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=15 nodelay;
            proxy_pass http://django;
            include    /etc/nginx/snippets/proxy_params.conf;
        }

        # ── Django app ────────────────────────────────────────────────────────
        location / {
            proxy_pass http://django;
            include    /etc/nginx/snippets/proxy_params.conf;
        }

        # ── Health check (no rate limit, no logging) ──────────────────────────
        location /health/ {
            proxy_pass   http://django;
            access_log   off;
            proxy_read_timeout 5s;
        }
    }
}
